name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API tests and image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run API integration tests
        run: docker build --target test -f application/Dockerfile application
      - name: Build runtime image
        run: docker build --target runtime -t healthcare-api:ci -f application/Dockerfile application

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Check formatting
        run: terraform fmt -check -recursive infrastructure
      - name: Initialize without a backend
        run: terraform -chdir=infrastructure/live/dev init -backend=false
      - name: Validate configuration
        run: terraform -chdir=infrastructure/live/dev validate
